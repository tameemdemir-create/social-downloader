<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محمل السوشيال ميديا</title>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; text-align: center; padding: 20px; direction: rtl; }
        .container { max-width: 500px; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: 40px auto; }
        h2 { color: #333; }
        input { width: 100%; padding: 14px; margin: 15px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        button { width: 100%; padding: 14px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .result { margin-top: 25px; display: none; background: #fafafa; padding: 15px; border-radius: 8px; border: 1px solid #eee; }
        .result img { max-width: 100%; border-radius: 8px; max-height: 200px; object-fit: cover; margin-top: 10px; }
        .download-btn { display: inline-block; margin-top: 15px; padding: 12px 25px; background: #28a745; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .download-btn:hover { background: #218838; }
    </style>
</head>
<body>

<div class="container">
    <h2>تحميل من السوشيال ميديا 🚀</h2>
    <p>أدخل رابط الفيديو، الصورة، أو الصوت من أي تطبيق:</p>
    <input type="text" id="mediaUrl" placeholder="انسخ الرابط وضعه هنا...">
    <button onclick="getMedia()">استخراج الرابط والتحميل</button>

    <div id="resultBox" class="result">
        <h4 id="mediaTitle"></h4>
        <img id="mediaThumb" src="" alt="المعاينة">
        <br>
        <a id="downloadLink" class="download-btn" href="#" target="_blank" download>اضغط هنا لحفظ الملف في الهاتف</a>
    </div>
</div>

<script>
    async function getMedia() {
        const url = document.getElementById('mediaUrl').value;
        if(!url) return Swal.fire('تنبيه', 'الرجاء وضع رابط أولاً', 'warning');

        Swal.fire({ 
            title: 'جاري استخراج الرابط...', 
            text: 'قد يستغرق الاستخراج أول مرة حوالي 50 ثانية لتشغيل السيرفر المجاني', 
            allowOutsideClick: false, 
            didOpen: () => Swal.showLoading() 
        });

        try {
            const response = await fetch('https://onrender.com', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: url })
            });
            
            const data = await response.json();
            Swal.close();

            if(data.success) {
                document.getElementById('resultBox').style.display = 'block';
                document.getElementById('mediaTitle').innerText = data.title;
                document.getElementById('mediaThumb').src = data.thumbnail;
                document.getElementById('downloadLink').href = data.download_url;
            } else {
                Swal.fire('خطأ', 'فشل استخراج الرابط، تأكد من أن الفيديو عام والرابط صحيح', 'error');
            }
        } catch (error) {
            Swal.close();
            Swal.fire('خطأ', 'حدثت مشكلة في الاتصال بالسيرفر', 'error');
        }
    }
</script>
</body>
</html>
